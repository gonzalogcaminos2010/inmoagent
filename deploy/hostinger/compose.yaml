name: inmoagent-review
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - demo_db:/var/lib/postgresql
    networks: [demo_private]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    shm_size: 64m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  migrate:
    build: {context: ../.., dockerfile: deploy/hostinger/Dockerfile, target: runtime}
    image: inmoagent-review-api:${DEMO_VERSION:?Set immutable local version}
    command: [node, dist/packages/db/src/migrate.js]
    environment:
      MIGRATOR_URL: postgres://postgres@db:5432/postgres
      MIGRATION_DATABASE_URL: postgres://postgres@db:5432/inmoagent
    networks: [demo_private]
    depends_on: {db: {condition: service_healthy}}
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs: [/tmp:size=32m]
    profiles: [tools]
  api:
    build: {context: ../.., dockerfile: deploy/hostinger/Dockerfile, target: runtime}
    image: inmoagent-review-api:${DEMO_VERSION:?Set immutable local version}
    environment:
      HOST: 127.0.0.1
      DEMO_ORIGIN: ${DEMO_ORIGIN:?Set exact HTTPS origin}
      DATABASE_URL: postgres://inmo_app@db:5432/inmoagent
    ports: ["127.0.0.1:${DEMO_LOOPBACK_PORT:-18080}:8080"]
    networks: [demo_private, demo_ingress]
    depends_on: {db: {condition: service_healthy}}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs: [/tmp:size=32m]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  web:
    build: {context: ../.., dockerfile: deploy/hostinger/Dockerfile, target: web}
    image: inmoagent-review-web:${DEMO_VERSION:?Set immutable local version}
    network_mode: service:api
    depends_on: {api: {condition: service_healthy}}
    secrets: [demo_auth]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    read_only: true
    tmpfs: [/tmp:size=16m]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "test -r /run/secrets/demo_auth && wget -q -O /dev/null http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
networks:
  demo_private:
    name: inmoagent-review-private
    internal: true
  demo_ingress:
    name: inmoagent-review-ingress
volumes:
  demo_db:
    name: inmoagent-review-data
secrets:
  demo_auth:
    file: ${DEMO_AUTH_FILE:?Protection required; supply approved hashed credentials file}
