pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=demo:1m rate=10r/s;
  server {
    listen 8080;
    auth_basic "inmoagent demo privada";
    auth_basic_user_file /run/secrets/demo_auth;
    limit_req zone=demo burst=20 nodelay;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location /api/ {
      proxy_pass http://127.0.0.1:3001/;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Authorization "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
    }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
  }
  server { listen 127.0.0.1:8081; location = /health { access_log off; return 200 "ok\n"; } }
}
